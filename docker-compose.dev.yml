# Só o banco, para desenvolvimento e testes. Produção (stack Swarm) fica para a Etapa 12.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque
    ports: ['5432:5432']
    volumes:
      - pgdata-dev:/var/lib/postgresql
      - ./docker/dev-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estoque -d estoque']
      interval: 5s
      retries: 10
volumes:
  pgdata-dev: {}
